<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family &amp; Friends | Melvin John Carolino</title>
<style>
  :root {
    --bg: #070707;
    --ink: #f5f5f5;
    --muted: rgba(255,255,255,.72);
    --red: #e10600;
    --red-deep: #8a0300;
    --x: 0;
    --y: 0;
    --gap: clamp(10px, 1.6vw, 24px);
    --ease: cubic-bezier(.2, .8, .1, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  /* ---------- Background depth layers ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .px { position: absolute; inset: 0; will-change: transform; }
  .px-a { transform: translate3d(calc(var(--x) * -50px), calc(var(--y) * -36px), 0); }
  .px-b { transform: translate3d(calc(var(--x) * -26px), calc(var(--y) * -18px), 0); }
  .px-w { transform: translate3d(calc(var(--x) * -34px), calc(var(--y) * -20px), 0); }
  .orb { position: absolute; border-radius: 50%; filter: blur(70px); }
  .orb.a {
    width: 46vmax; height: 46vmax; left: -10vmax; top: 4vh; opacity: .55;
    background: radial-gradient(circle, #e10600 0%, transparent 65%);
    animation: drift1 14s ease-in-out infinite alternate;
  }
  .orb.b {
    width: 36vmax; height: 36vmax; right: -8vmax; bottom: -12vmax; opacity: .7;
    background: radial-gradient(circle, #8a0300 0%, transparent 65%);
    animation: drift2 18s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(8vmax, 6vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-10vmax, -6vmax) scale(1.2); } }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse at 40% 45%, #000 0%, transparent 75%);
            mask-image: radial-gradient(ellipse at 40% 45%, #000 0%, transparent 75%);
    animation: gridmove 20s linear infinite;
  }
  @keyframes gridmove { to { background-position: 56px 56px, 56px 56px; } }
  .watermark {
    position: absolute; left: 50%; bottom: -3vw;
    transform: translateX(-50%);
    font-weight: 900; text-transform: uppercase; white-space: nowrap;
    font-size: 24vw; line-height: .8; letter-spacing: -0.05em;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(225, 6, 0, .22);
    animation: wmove 16s ease-in-out infinite alternate;
  }
  @keyframes wmove { from { transform: translateX(-54%); } to { transform: translateX(-46%); } }
  .grain {
    position: absolute; inset: -50%; opacity: .08;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1s steps(6) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0, 0); } 20% { transform: translate(-3%, 2%); }
    40% { transform: translate(2%, -3%); } 60% { transform: translate(-2%, -1%); }
    80% { transform: translate(3%, 3%); } 100% { transform: translate(0, 0); }
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.6) 100%);
  }

  /* ---------- Page (fits one screen, no scrolling) ---------- */
  .page {
    position: relative; z-index: 1;
    height: 100vh; height: 100dvh;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
    padding: 0 clamp(20px, 6vw, 110px) clamp(16px, 3.5vh, 40px);
  }

  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: clamp(14px, 3vh, 30px) 0;
    animation: fadeUp .8s .1s var(--ease) both;
  }
  .brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; font-size: 13px; }
  .seal { display: block; height: clamp(34px, 6.2vh, 54px); width: auto; filter: drop-shadow(0 0 14px rgba(225, 6, 0, .35)); }
  .brand b { color: var(--red); }
  .links { display: flex; gap: clamp(16px, 3vw, 40px); }
  .links a {
    position: relative; color: var(--muted); text-decoration: none;
    font-size: 12px; letter-spacing: .3em; text-transform: uppercase;
    padding: 6px 0; transition: color .3s;
  }
  .links a::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
    background: var(--red); transform: scaleX(0); transform-origin: left;
    transition: transform .35s var(--ease);
  }
  .links a:hover, .links a.active { color: #fff; }
  .links a:hover::after, .links a.active::after { transform: scaleX(1); }

  /* ---------- Heading ---------- */
  .head { padding-bottom: clamp(10px, 2.2vh, 24px); }
  .eyebrow {
    display: flex; align-items: center; gap: 14px;
    font-size: clamp(10px, 1.6vh, 13px); letter-spacing: .45em; text-transform: uppercase;
    color: var(--muted); margin-bottom: clamp(6px, 1.4vh, 14px);
    animation: fadeUp .8s .3s var(--ease) both;
  }
  .eyebrow::before { content: ""; flex: none; width: 42px; height: 2px; background: var(--red); }
  h1 {
    font-weight: 800; text-transform: uppercase; letter-spacing: -0.03em; line-height: .95;
    font-size: clamp(28px, min(5vw, 8vh), 80px);
  }
  .line { display: inline-block; vertical-align: top; overflow: hidden; padding: .03em 0; }
  .line > span { display: block; animation: rise 1s var(--ease) both; }
  .line:nth-child(1) > span { animation-delay: .4s; }
  .line:nth-child(2) > span { animation-delay: .55s; color: var(--red); }
  @keyframes rise { from { transform: translateY(110%); } to { transform: translateY(0); } }
  .bar {
    height: 6px; width: clamp(48px, 6vw, 96px); background: var(--red);
    margin-top: clamp(8px, 1.6vh, 18px);
    transform-origin: left; animation: grow .9s 1s var(--ease) both;
  }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  /* ---------- Four photos, sized to always fit the screen ---------- */
  .photos {
    min-height: 0;
    container-type: size;
    display: flex; justify-content: center; align-items: center;
    gap: var(--gap);
  }
  .shot {
    position: relative; margin: 0; overflow: hidden;
    /* 3:4 portrait; as tall as the space allows, never wider than a quarter of the row */
    height: min(100cqh, calc((100cqw - 3 * var(--gap)) / 3));
    aspect-ratio: 3 / 4;
    flex: none;
    border: 2px solid var(--red); background: #0b1020;
    box-shadow: 0 24px 50px rgba(0,0,0,.6), 0 0 40px rgba(225, 6, 0, .2);
    animation: cardIn .9s calc(.5s + var(--d, 0s)) var(--ease) backwards;
    transition: transform .4s var(--ease), box-shadow .4s, border-color .4s;
  }
  .shot:hover {
    transform: translateY(-6px);
    box-shadow: 0 30px 60px rgba(0,0,0,.6), 0 0 54px rgba(225, 6, 0, .4);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
  .shot img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: var(--pos, center);
    transition: transform 1.2s var(--ease);
  }
  .shot:hover img { transform: scale(1.05); }
  .shot::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.25) 50%, transparent 62%);
    transform: translateX(-130%);
    animation: shine 6s calc(2s + var(--d, 0s)) ease-in-out infinite;
  }
  @keyframes shine { 0% { transform: translateX(-130%); } 30%, 100% { transform: translateX(130%); } }
  .shot figcaption {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 40px 14px 14px;
    background: linear-gradient(transparent, rgba(0,0,0,.9));
  }
  .shot h2 { font-size: clamp(12px, 2vh, 18px); line-height: 1.2; letter-spacing: -0.01em; }
  .shot p { margin-top: 3px; color: var(--muted); font-size: clamp(10px, 1.5vh, 13px); }
  .shot p .dot {
    display: inline-block; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%;
    background: var(--red); box-shadow: 0 0 10px var(--red);
  }

  /* ---------- Phone / narrow: 2 x 2 grid, still one screen ---------- */
  @media (max-width: 860px) {
    .page { padding: 0 5vw 2.5vh; }
    nav { padding: clamp(8px, 1.6vh, 14px) 0; gap: 10px; }
    .brand .bn { display: none; }
    .links { gap: 12px; }
    .links a { font-size: 10px; letter-spacing: .12em; }
    .eyebrow { letter-spacing: .2em; font-size: 9.5px; gap: 8px; }
    .eyebrow::before { width: 18px; }
    h1 { font-size: clamp(22px, 7.5vw, 40px); }
    .bar { height: 4px; }
    .photos {
      display: grid; grid-template-columns: repeat(2, auto); grid-template-rows: repeat(2, auto);
      justify-content: center; align-content: center;
    }
    .shot {
      height: auto;
      width: min((100cqw - var(--gap)) / 2, (100cqh - var(--gap)) * 3 / 8);
    }
    .shot figcaption { padding: 24px 8px 8px; }
    .shot h2 { font-size: 11px; }
    .shot p { font-size: 9.5px; }
  }
  @media (max-width: 560px) { .amp { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="bg">
    <div class="px px-a"><div class="orb a"></div><div class="orb b"></div></div>
    <div class="px px-b"><div class="grid"></div></div>
    <div class="px px-w"><div class="watermark">Family</div></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <div class="page">
    <nav>
      <a class="brand" href="index.html"><img class="seal" src="images/UC_Official_Seal.png" alt="University of the Cordilleras seal" onerror="this.remove()"><span class="bn">Melvin John <b>Carolino</b></span></a>
      <div class="links">
        <a href="index.html">Home</a>
        <a href="about.html">Personal Info</a>
        <a href="achievements.html">Achievements</a>
        <a href="family.html" class="active">Family<span class="amp"> &amp; Friends</span></a>
      </div>
    </nav>

    <div class="head">
      <p class="eyebrow">The people who matter</p>
      <h1><span class="line"><span>Family</span></span> <span class="line"><span>&amp; Friends</span></span></h1>
      <div class="bar"></div>
    </div>

    <div class="photos">
      <figure class="shot" style="--d:0s; --pos: 50% 50%">
        <img src="images/mother.png" alt="Melvin hugging his mother">
        <figcaption><h2>With My Mother</h2><p><span class="dot"></span>A warm hug</p></figcaption>
      </figure>
      <figure class="shot" style="--d:.12s; --pos: 50% 50%">
        <img src="images/father.png" alt="Melvin shaking his father's hand">
        <figcaption><h2>With My Father</h2><p><span class="dot"></span>A handshake</p></figcaption>
      </figure>
      <figure class="shot" style="--d:.24s; --pos: 57% 50%">
        <img src="images/sibling.jpg" alt="Melvin with his siblings">
        <figcaption><h2>With My Siblings</h2><p><span class="dot"></span>Family picture</p></figcaption>
      </figure>
      <figure class="shot" style="--d:.36s; --pos: 50% 100%">
        <img src="images/friends.jpg" alt="Melvin and his friends taking a group selfie">
        <figcaption><h2>With My Friends</h2><p><span class="dot"></span>Groupie</p></figcaption>
      </figure>
    </div>
  </div>

  <script>
    (function () {
      var fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
      var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!fine || calm) return;
      var root = document.documentElement;
      var tx = 0, ty = 0, x = 0, y = 0, raf = 0;
      addEventListener('pointermove', function (e) {
        tx = e.clientX / innerWidth - 0.5;
        ty = e.clientY / innerHeight - 0.5;
        if (!raf) raf = requestAnimationFrame(tick);
      });
      function tick() {
        x += (tx - x) * 0.08;
        y += (ty - y) * 0.08;
        root.style.setProperty('--x', x.toFixed(4));
        root.style.setProperty('--y', y.toFixed(4));
        raf = (Math.abs(tx - x) > 0.001 || Math.abs(ty - y) > 0.001) ? requestAnimationFrame(tick) : 0;
      }
    })();
  </script>
</body>
</html>
