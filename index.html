<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carolino Melvin John</title>
<style>
  :root {
    --bg: #070707;
    --ink: #f5f5f5;
    --red: #e10600;
    --red-deep: #8a0300;
    --x: 0;
    --y: 0;
    --ease: cubic-bezier(.2, .8, .1, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  /* ---------- Background depth layers ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .px { position: absolute; inset: 0; will-change: transform; }
  .px-a { transform: translate3d(calc(var(--x) * -50px), calc(var(--y) * -36px), 0); }
  .px-b { transform: translate3d(calc(var(--x) * -26px), calc(var(--y) * -18px), 0); }
  .px-w { transform: translate3d(calc(var(--x) * -34px), calc(var(--y) * -20px), 0); }

  .orb { position: absolute; border-radius: 50%; filter: blur(70px); }
  .orb.a {
    width: 46vmax; height: 46vmax; left: -6vmax; top: 8vh; opacity: .6;
    background: radial-gradient(circle, #e10600 0%, transparent 65%);
    animation: drift1 14s ease-in-out infinite alternate;
  }
  .orb.b {
    width: 36vmax; height: 36vmax; right: -8vmax; bottom: -12vmax; opacity: .7;
    background: radial-gradient(circle, #8a0300 0%, transparent 65%);
    animation: drift2 18s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(8vmax, 6vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-10vmax, -6vmax) scale(1.2); } }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse at 35% 50%, #000 0%, transparent 72%);
            mask-image: radial-gradient(ellipse at 35% 50%, #000 0%, transparent 72%);
    animation: gridmove 20s linear infinite;
  }
  @keyframes gridmove { to { background-position: 56px 56px, 56px 56px; } }

  .watermark {
    position: absolute; left: 50%; bottom: -3vw;
    transform: translateX(-50%);
    font-weight: 900; text-transform: uppercase; white-space: nowrap;
    font-size: 24vw; line-height: .8; letter-spacing: -0.05em;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(225, 6, 0, .28);
    animation: wmove 16s ease-in-out infinite alternate;
  }
  @keyframes wmove { from { transform: translateX(-54%); } to { transform: translateX(-46%); } }

  .grain {
    position: absolute; inset: -50%; opacity: .08;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1s steps(6) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0, 0); } 20% { transform: translate(-3%, 2%); }
    40% { transform: translate(2%, -3%); } 60% { transform: translate(-2%, -1%); }
    80% { transform: translate(3%, 3%); } 100% { transform: translate(0, 0); }
  }

  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.65) 100%);
  }

  /* ---------- Layout ---------- */
  .hero {
    position: relative; z-index: 1;
    height: 100vh; height: 100dvh;
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    column-gap: clamp(32px, 6vw, 110px);
    padding: clamp(16px, 4vh, 48px) clamp(24px, 6vw, 110px);
  }

  /* ---------- Photo ---------- */
  .photo {
    grid-column: 1;
    height: 100%;
    display: flex; align-items: center;
    padding-right: 20px;
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .frame {
    position: relative;
    height: 100%;
    aspect-ratio: 3 / 4;
    max-width: 100%;
    transform: perspective(1100px) rotateX(calc(var(--y) * -7deg)) rotateY(calc(var(--x) * 9deg));
    will-change: transform;
  }
  .frame::before {              /* solid block behind, bottom-right */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--red-deep), #3a0100);
    transform: translate(18px, 18px);
    animation: slideBlock 1s .35s var(--ease) both;
  }
  .frame::after {               /* thin outline peeking top-left */
    content: ""; position: absolute; inset: 0;
    border: 2px solid var(--red);
    transform: translate(-12px, -12px);
    animation: slideOutline 1s .5s var(--ease) both;
  }
  @keyframes slideBlock { from { transform: translate(0, 0); opacity: 0; } to { transform: translate(18px, 18px); opacity: 1; } }
  @keyframes slideOutline { from { transform: translate(0, 0); opacity: 0; } to { transform: translate(-12px, -12px); opacity: 1; } }

  .img-wrap {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    overflow: hidden;
    border: 2px solid var(--red);
    background: #fff;
    box-shadow: 0 30px 60px rgba(0,0,0,.6), 0 0 60px rgba(225, 6, 0, .25);
    animation: reveal 1.1s .1s var(--ease) both;
  }
  @keyframes reveal { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
  .img-wrap img {
    display: block; width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    animation: zoomout 1.6s .1s var(--ease) both;
  }
  @keyframes zoomout { from { transform: scale(1.25); } to { transform: scale(1); } }
  .shine {
    position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.35) 50%, transparent 62%);
    transform: translateX(-130%);
    animation: shine 6s 2s ease-in-out infinite;
  }
  @keyframes shine { 0% { transform: translateX(-130%); } 30%, 100% { transform: translateX(130%); } }

  /* ---------- Name ---------- */
  .info {
    grid-column: 2;
    transform: translate3d(calc(var(--x) * 16px), calc(var(--y) * 10px), 0);
  }
  .eyebrow {
    display: flex; align-items: center; gap: 14px;
    font-size: clamp(10px, 1.1vw, 15px);
    letter-spacing: .45em; text-transform: uppercase;
    color: rgba(255,255,255,.65);
    margin-bottom: clamp(14px, 2.4vh, 28px);
    animation: fadeUp .8s .9s var(--ease) both;
  }
  .eyebrow::before { content: ""; width: 42px; height: 2px; background: var(--red); }

  .name {
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: .95;
    font-size: clamp(40px, 7vw, 120px);
    text-transform: uppercase;
  }
  .line { display: block; overflow: hidden; padding: .03em 0; }
  .line > span { display: block; animation: rise 1s var(--ease) both; }
  .line:nth-child(1) > span { animation-delay: .5s; }
  .line:nth-child(2) > span { animation-delay: .65s; }
  .line:nth-child(3) > span { animation-delay: .8s; }
  @keyframes rise { from { transform: translateY(110%); } to { transform: translateY(0); } }

  .line.last > span {
    color: var(--red);
    animation: rise 1s .8s var(--ease) both, glow 3.5s 2s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 0 rgba(225, 6, 0, 0); }
    50% { text-shadow: 0 0 36px rgba(225, 6, 0, .7); }
  }

  .bar {
    height: 6px; background: var(--red);
    margin-top: clamp(14px, 2vh, 24px);
    width: clamp(48px, 6vw, 96px);
    transform-origin: left;
    animation: grow .9s 1.3s var(--ease) both;
  }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .next {
    position: fixed; right: clamp(16px, 3vw, 40px); bottom: clamp(14px, 3.5vh, 36px);
    z-index: 3; display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 22px; border: 1px solid var(--red); color: #fff; text-decoration: none;
    font-size: 12px; letter-spacing: .3em; text-transform: uppercase;
    background: rgba(225, 6, 0, .12);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: background .3s, box-shadow .3s;
    animation: fadeUp .8s 1.5s var(--ease) both;
  }
  .next:hover { background: var(--red); box-shadow: 0 0 30px rgba(225, 6, 0, .6); }
  .next span { transition: transform .3s; }
  .next:hover span { transform: translateX(5px); }

  /* ---------- Phone / portrait ---------- */
  @media (max-aspect-ratio: 1/1) {
    .hero { column-gap: 5vw; padding: 5vh 5vw; }
    .photo { height: auto; max-height: 100%; padding-right: 12px; }
    .frame { height: auto; width: 44vw; max-height: 90vh; }
    .frame::before { transform: translate(10px, 10px); }
    @keyframes slideBlock { from { transform: translate(0, 0); opacity: 0; } to { transform: translate(10px, 10px); opacity: 1; } }
    .frame::after { transform: translate(-7px, -7px); }
    @keyframes slideOutline { from { transform: translate(0, 0); opacity: 0; } to { transform: translate(-7px, -7px); opacity: 1; } }
    .name { font-size: clamp(22px, 8vw, 56px); }
    .bar { height: 4px; }
    .eyebrow { letter-spacing: .3em; }
    .eyebrow::before { width: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="bg">
    <div class="px px-a"><div class="orb a"></div><div class="orb b"></div></div>
    <div class="px px-b"><div class="grid"></div></div>
    <div class="px px-w"><div class="watermark">Carolino</div></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <main class="hero">
    <div class="photo">
      <div class="frame">
        <div class="img-wrap">
          <img src="photo.jpg.jfif" alt="Portrait of Carolino Melvin John"
               onerror="var s=this.dataset.t||'0',l=['photo.jpg','photo.jpeg','photo.png','photo.webp'];if(+s<l.length){this.dataset.t=+s+1;this.src=l[+s];}">
          <div class="shine"></div>
        </div>
      </div>
    </div>

    <div class="info">
      <p class="eyebrow">Portfolio</p>
      <h1 class="name">
        <span class="line"><span>Carolino</span></span>
        <span class="line"><span>Melvin</span></span>
        <span class="line last"><span>John</span></span>
      </h1>
      <div class="bar"></div>
    </div>
  </main>

  <a class="next" href="about.html">Personal info <span>&rarr;</span></a>

  <script>
    (function () {
      var fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
      var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!fine || calm) return;
      var root = document.documentElement;
      var tx = 0, ty = 0, x = 0, y = 0, raf = 0;
      addEventListener('pointermove', function (e) {
        tx = e.clientX / innerWidth - 0.5;
        ty = e.clientY / innerHeight - 0.5;
        if (!raf) raf = requestAnimationFrame(tick);
      });
      function tick() {
        x += (tx - x) * 0.08;
        y += (ty - y) * 0.08;
        root.style.setProperty('--x', x.toFixed(4));
        root.style.setProperty('--y', y.toFixed(4));
        raf = (Math.abs(tx - x) > 0.001 || Math.abs(ty - y) > 0.001) ? requestAnimationFrame(tick) : 0;
      }
    })();
  </script>
</body>
</html>
