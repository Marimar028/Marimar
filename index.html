<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carolino Melvin John</title>
<style>
  :root {
    --bg: #070707;
    --ink: #f5f5f5;
    --red: #e10600;
    --red-deep: #8a0300;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(60vmax 60vmax at 30% 55%, rgba(225, 6, 0, 0.22), transparent 60%),
      var(--bg);
  }

  .hero {
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    column-gap: clamp(32px, 6vw, 110px);
    padding: clamp(16px, 4vh, 48px) clamp(24px, 6vw, 110px);
  }

  .photo {
    grid-column: 1;
    height: 100%;
    display: flex;
    align-items: center;
    padding-right: 14px; /* room for the red offset block */
  }
  .photo img {
    display: block;
    height: 100%;
    width: auto;
    max-width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    object-position: top center;
    background: #fff;
    border: 2px solid var(--red);
    box-shadow: 14px 14px 0 var(--red-deep);
  }

  .name {
    grid-column: 2;
    text-align: left;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 0.95;
    font-size: clamp(40px, 7vw, 120px);
    text-transform: uppercase;
    color: var(--ink);
  }
  .name span { display: block; }
  .name .last { color: var(--red); }
  .name::after {
    content: "";
    display: block;
    width: clamp(48px, 6vw, 96px);
    height: 6px;
    margin-top: clamp(14px, 2vh, 24px);
    background: var(--red);
  }

  /* Phone / portrait screens: photo on the left, name beside it */
  @media (max-aspect-ratio: 1/1) {
    .hero {
      column-gap: 5vw;
      padding: 5vh 5vw;
    }
    .photo { height: auto; max-height: 100%; padding-right: 8px; }
    .photo img {
      height: auto;
      width: 44vw;
      max-height: 90vh;
      box-shadow: 8px 8px 0 var(--red-deep);
    }
    .name { font-size: clamp(22px, 8vw, 56px); }
    .name::after { height: 4px; }
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="photo">
      <img src="photo.jpg" alt="Portrait of Carolino Melvin John"
           onerror="var s=this.dataset.t||'0',l=['photo.jpeg','photo.png','photo.webp'];if(+s<l.length){this.dataset.t=+s+1;this.src=l[+s];}">
    </div>
    <h1 class="name">
      <span>Carolino</span>
      <span>Melvin</span>
      <span class="last">John</span>
    </h1>
  </main>
</body>
</html>
